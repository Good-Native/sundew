name: Auto Release

# Ported from Good-Native/bloom (changelog.d fragment convention).
# On every push to main: if changelog.d/ holds pending fragments and the
# merged PR is not labelled `no-release`, this workflow:
#   1. Collates the fragments into a ## [X.Y.Z] – YYYY-MM-DD section in
#      CHANGELOG.md (via changelog.mjs) and deletes them.
#   2. Bumps the version in manifest.json to match.
#   3. Amends the merge commit with both edits and force-pushes.
#   4. Creates and pushes a `vX.Y.Z` tag.
#   5. Creates a GitHub release with the extracted notes and the packed
#      extension zip attached.
#
# Uses the default GITHUB_TOKEN. If branch protection is enabled on
# `main`, swap in a fine-grained PAT with contents:write (see bloom's
# auto-release.yml for the 1Password-loaded PAT pattern).

on:
  push:
    branches:
      - main

# Serialise runs so two close pushes to main can't race on tag/release
# creation. Queue rather than cancel so no merge loses its release.
concurrency:
  group: auto-release-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  auto-tag:
    name: Auto Tag Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for no-release label
        id: skip
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const sha = context.sha;
            let shouldSkip = false;

            try {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha
              });

              if (prs && prs.length > 0) {
                shouldSkip = prs.some(pr =>
                  pr.labels && pr.labels.some(label => label.name === 'no-release')
                );
              }
            } catch (error) {
              core.warning(`Could not check PR labels: ${error.message}`);
            }

            core.setOutput('should_skip', shouldSkip ? 'true' : 'false');

      - name: Check for pending changelog fragments
        id: check
        run: |
          # Require the permanent history marker so the rewrite below can
          # deterministically find its anchor. If someone removes it, fail
          # loudly instead of silently no-op'ing on the next release.
          if ! grep -q "^## Full changelog history$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing the '## Full changelog history' marker"
            exit 1
          fi

          FRAGMENTS=$(node .github/workflows/scripts/changelog.mjs collect --files)

          if [ -z "$FRAGMENTS" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "No fragments in changelog.d/ - skipping release"
          else
            RELEASE_TYPE=$(node .github/workflows/scripts/changelog.mjs collect --bump)
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
            echo "Detected release type: $RELEASE_TYPE from:"
            echo "$FRAGMENTS"
          fi

      - name: Determine version bump
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        id: bump
        env:
          RELEASE_TYPE: ${{ steps.check.outputs.release_type }}
        run: |
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          CURRENT_VERSION=${CURRENT_TAG#v}
          CURRENT_VERSION=${CURRENT_VERSION%%-*}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$RELEASE_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$RELEASE_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $NEW_VERSION"

      - name: Update changelog
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          VERSION_NO_V="${NEW_VERSION#v}"
          TODAY=$(date +%Y-%m-%d)

          node .github/workflows/scripts/changelog.mjs release "$VERSION_NO_V" "$TODAY"

          # The script fails loudly on a malformed changelog, but assert the new
          # version header is present so we also fail fast if the format ever
          # drifts out of sync with the script.
          if ! grep -q "^## \[$VERSION_NO_V\] – $TODAY\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md rewrite failed — '## [$VERSION_NO_V] – $TODAY' not found"
            exit 1
          fi

          echo "Updated CHANGELOG.md with version $VERSION_NO_V"

      - name: Update manifest.json version
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          VERSION_NO_V="${NEW_VERSION#v}"
          jq --arg v "$VERSION_NO_V" '.version = $v' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json
          grep '"version"' manifest.json

      - name: Commit changelog update
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md manifest.json
          node .github/workflows/scripts/changelog.mjs collect --files \
            | grep . \
            | xargs -r git rm -q --
          # Amend the merge commit to include changelog update
          git commit --amend --no-edit
          git push --force-with-lease origin main

      - name: Create and push tag
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

      - name: Pack extension zip
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          # Extension files only — the picker page deploys separately and
          # repo metadata has no place in a packed extension.
          zip "sundew-$NEW_VERSION.zip" \
            manifest.json background.js sheets.js \
            options.html options.js popup.html popup.js \
            sundew.css icons/icon.svg icons/wordmark.svg icons/wordmark-on-amber.svg \
            icons/wordmark-yellow-on-red.svg fonts/inter-var-latin.woff2 \
            icons/icon-16.png icons/icon-32.png icons/icon-48.png icons/icon-128.png

      - name: Extract changelog content
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          VERSION_NO_V="${NEW_VERSION#v}"
          awk "/^## \[$VERSION_NO_V\]/ {flag=1; next} /^## \[/ {flag=0} flag" CHANGELOG.md > "$RUNNER_TEMP/changelog_extract.md"
          echo "Extracted changelog content for $VERSION_NO_V"

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true' &&
          steps.skip.outputs.should_skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --notes-file "$RUNNER_TEMP/changelog_extract.md" \
            "sundew-$NEW_VERSION.zip"
