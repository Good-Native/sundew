name: Changelog Check

# Ported from Good-Native/bloom (changelog.d fragment convention),
# trimmed to a single main branch.

on:
  pull_request:
    branches:
      - main

jobs:
  check-changelog:
    name: Validate Changelog Updated
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CODE=$(git diff --name-only "origin/$BASE_REF...HEAD" \
            | grep -vE '(\.md$|^docs/|^LICENSE$|^\.gitignore$|^\.gitattributes$|^\.github/)' || true)

          if [ -z "$CODE" ]; then
            echo "code_changed=false" >> $GITHUB_OUTPUT
            echo "Docs/config only — the fragment requirement does not apply."
          else
            echo "code_changed=true" >> $GITHUB_OUTPUT
            echo "Code changed:"
            echo "$CODE"
          fi

      - name: Require a changelog fragment
        if: steps.changes.outputs.code_changed == 'true' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          ADDED=$(git diff --name-only --diff-filter=A "origin/$BASE_REF...HEAD" -- 'changelog.d/*' \
            | grep -vE '^changelog\.d/(README\.md|\.gitkeep)$' || true)

          if [ -z "$ADDED" ]; then
            echo "❌ ERROR: this PR adds no changelog fragment"
            echo ""
            echo "Add one file: changelog.d/<branch-slug>.md"
            echo "  ---"
            echo "  bump: patch"
            echo "  ---"
            echo ""
            echo "  ### Fixed"
            echo ""
            echo "  - What changed."
            echo ""
            echo "See changelog.d/README.md. Add the 'no-changelog' label to skip this check."
            exit 1
          fi

          echo "✅ Changelog fragment added:"
          echo "$ADDED"

      - name: Validate fragments and compute release preview
        id: check
        run: |
          FILES=$(node .github/workflows/scripts/changelog.mjs collect --files)
          if [ -z "$FILES" ]; then
            echo "has_fragments=false" >> $GITHUB_OUTPUT
            echo "No pending fragments — merge will not cut a release."
            exit 0
          fi
          echo "has_fragments=true" >> $GITHUB_OUTPUT

          RELEASE_TYPE=$(node .github/workflows/scripts/changelog.mjs collect --bump)
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT

          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          CURRENT_VERSION=${CURRENT_TAG#v}
          CURRENT_VERSION=${CURRENT_VERSION%%-*}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"

          if [ "$RELEASE_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$RELEASE_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Next version will be: $NEW_VERSION"

      - name: Comment on PR with version info
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RELEASE_TYPE: ${{ steps.check.outputs.release_type }}
          NEXT_VERSION: ${{ steps.check.outputs.next_version }}
          HAS_FRAGMENTS: ${{ steps.check.outputs.has_fragments }}
        with:
          script: |
            const releaseType = process.env.RELEASE_TYPE;
            const nextVersion = process.env.NEXT_VERSION;
            const hasFragments = process.env.HAS_FRAGMENTS === 'true';

            const body = !hasFragments
              ? `## 🏷️ Release Preview

            No pending changelog fragments — merging this PR will not create a release.`
              : `## 🏷️ Release Preview

            When this PR is merged, it will automatically create:

            - **Version:** \`${nextVersion}\` (${releaseType} release)
            - **Tag:** \`${nextVersion}\`
            - **GitHub Release:** with changelog content and the packed extension zip

            The changelog will be assembled from \`changelog.d/\` automatically.

            ---

            💡 **Tips:**
            - Set \`bump:\` in your fragment's frontmatter to control release type — the release takes the highest bump across all pending fragments:
              - \`bump: patch\` → patch release (default)
              - \`bump: minor\` → minor release
              - \`bump: major\` → major release
            - Add \`no-changelog\` label to skip the fragment requirement (e.g., for docs-only changes)
            - Add \`no-release\` label to skip release creation`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('🏷️ Release Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
