name: Deploy Picker

# Deploys the static Google Picker page (picker/) to Cloudflare Workers
# whenever it changes on main. Same push-to-deploy pattern as bloom's
# deploy-worker.yml, minus the tenant matrix and 1Password (a static
# page needs no runtime secrets — just the deploy credentials).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — Workers deploy token
#   CLOUDFLARE_ACCOUNT_ID — Good Native Cloudflare account

on:
  push:
    branches: [main]
    paths:
      - "picker/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-picker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-picker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy

      - name: Verify deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sundew-picker.harvey-1c7.workers.dev/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Picker page returned HTTP $STATUS after deploy"
            exit 1
          fi
