<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sundew — Options</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 20px;
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 16px;
        padding: 12px 16px;
      }
      legend {
        font-weight: 600;
        padding: 0 6px;
      }
      label {
        display: block;
        margin: 10px 0 4px;
        font-size: 14px;
      }
      input[type="text"],
      select {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 14px;
      }
      button {
        font-size: 14px;
        padding: 8px 14px;
        margin: 8px 8px 0 0;
        cursor: pointer;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .row > div {
        flex: 1;
      }
      .hint {
        font-size: 12px;
        color: #666;
        margin-top: 2px;
      }
      #status {
        margin-top: 12px;
        font-size: 14px;
        white-space: pre-line;
      }
      #status.ok {
        color: #1a7f37;
      }
      #status.error {
        color: #b42318;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Sundew</h1>

    <fieldset>
      <legend>Google account</legend>
      <button id="signInButton">Sign in with Google</button>
      <span id="authState" class="hint"></span>
    </fieldset>

    <fieldset>
      <legend>Destination</legend>
      <label for="spreadsheetSelect">Spreadsheet</label>
      <div class="row">
        <div>
          <select id="spreadsheetSelect" disabled>
            <option value="">Sign in first</option>
          </select>
        </div>
        <button id="browseDriveButton">Browse Drive…</button>
      </div>
      <span class="hint"
        >The list shows spreadsheets already connected to this extension. Use
        Browse Drive to connect any other sheet you have access to.</span
      >

      <div id="newSheetWrap" class="row hidden">
        <div>
          <label for="newSheetName">New spreadsheet name</label>
          <input type="text" id="newSheetName" placeholder="Browser History" />
        </div>
        <button id="createSheetButton">Create</button>
      </div>
      <a id="openSheetLink" target="_blank" class="hint hidden"
        >Open in Google Sheets ↗</a
      >

      <div class="row">
        <div>
          <label for="tabSelect">Tab</label>
          <select id="tabSelect" disabled>
            <option value="">Select a spreadsheet first</option>
          </select>
        </div>
        <div id="newTabWrap" class="hidden">
          <label for="newTabName">New tab name</label>
          <input type="text" id="newTabName" placeholder="browser history" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>This device</legend>
      <label for="deviceLabel">Device label (written to each row)</label>
      <input type="text" id="deviceLabel" placeholder="e.g. MacBook, Work PC" />

      <label for="intervalSelect">Sync interval</label>
      <select id="intervalSelect">
        <option value="30">Every 30 minutes</option>
        <option value="60" selected>Every hour</option>
        <option value="120">Every 2 hours</option>
      </select>
    </fieldset>

    <button id="saveButton">Save</button>
    <button id="syncNowButton">Sync now</button>

    <div id="status"></div>

    <script src="sheets.js"></script>
    <script src="options.js"></script>
  </body>
</html>
