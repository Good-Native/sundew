<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sundew — Options</title>
    <link rel="stylesheet" href="sundew.css" />
    <style>
      body {
        background: var(--amber);
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
        margin: 0;
      }
      .brand {
        margin-bottom: 20px;
      }
      .brand img {
        height: 32px;
      }
      .card {
        background: var(--white);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .card h2 {
        font-size: 14px;
        font-weight: 600;
        color: var(--red);
        margin: 0 0 10px;
      }
      #status {
        margin-top: 12px;
        white-space: pre-line;
      }
      #openSheetLink {
        display: inline-block;
        margin-top: 6px;
      }
      #authState {
        margin-right: 10px;
      }
      #linkedSheetButton {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img
        src="icons/wordmark-on-amber.svg"
        alt="sundew"
        style="height: 40px"
      />
    </div>

    <section class="card">
      <h2>Google account</h2>
      <div id="signedOutView">
        <button id="signInButton" class="primary">Sign in with Google</button>
      </div>
      <div id="signedInView" class="hidden">
        <span id="authState" class="hint">Signed in</span>
        <button id="signOutButton">Sign out</button>
      </div>
    </section>

    <section class="card">
      <h2>Destination</h2>

      <div id="destLinked" class="hidden">
        <div class="row">
          <button id="linkedSheetButton" title="Open in Google Sheets"></button>
          <button id="changeDestButton">Change</button>
        </div>
      </div>

      <div id="destEditor">
        <label for="spreadsheetSelect">Spreadsheet</label>
        <div class="row">
          <div>
            <select id="spreadsheetSelect" disabled>
              <option value="">Sign in first</option>
            </select>
          </div>
          <button id="browseDriveButton">Browse Drive…</button>
        </div>
        <span class="hint"
          >The list shows spreadsheets already connected to this extension. Use
          Browse Drive to connect any other sheet you have access to.</span
        >

        <div id="newSheetWrap" class="row hidden">
          <div>
            <label for="newSheetName">New spreadsheet name</label>
            <input
              type="text"
              id="newSheetName"
              placeholder="Browser History"
            />
          </div>
          <button id="createSheetButton">Create</button>
        </div>
        <a id="openSheetLink" target="_blank" class="hidden"
          >Open in Google Sheets ↗</a
        >

        <div class="row">
          <div>
            <label for="tabSelect">Tab</label>
            <select id="tabSelect" disabled>
              <option value="">Select a spreadsheet first</option>
            </select>
          </div>
          <div id="newTabWrap" class="hidden">
            <label for="newTabName">New tab name</label>
            <input type="text" id="newTabName" placeholder="browser history" />
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>This device</h2>
      <label for="deviceLabel">Device label (written to each row)</label>
      <input type="text" id="deviceLabel" placeholder="e.g. MacBook, Work PC" />

      <label for="intervalSelect">Sync interval</label>
      <select id="intervalSelect">
        <option value="30">Every 30 minutes</option>
        <option value="60" selected>Every hour</option>
        <option value="120">Every 2 hours</option>
      </select>
    </section>

    <button id="saveButton" class="primary">Save</button>
    <button id="syncNowButton">Sync now</button>

    <div id="status"></div>

    <script src="sheets.js"></script>
    <script src="options.js"></script>
  </body>
</html>
