<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sundew — select a spreadsheet</title>
    <link rel="icon" href="icon.svg" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 13px;
        padding: 24px;
        color: #990b27;
        background: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 16px;
      }
      .brand img {
        height: 24px;
      }
      .brand span {
        font-size: 14px;
        font-weight: 500;
      }
      #message {
        font-size: 14px;
      }
      .error {
        color: #990b27;
        background: #f6a605;
        border-radius: 8px;
        padding: 6px 10px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="brand"><img src="icon.svg" alt="" /><span>sundew</span></div>
    <div id="message">Loading Google Picker…</div>
    <script>
      // Fill these in from the same GCP project as the extension's OAuth client.
      const API_KEY = "AIzaSyAg_2lgG3165rnGd-lGl7Hc27RZH1W2w_U"; // restricted to Google Picker API + this domain
      const APP_ID = "26449713823"; // numeric GCP project number

      const params = new URLSearchParams(location.hash.slice(1));
      const token = params.get("token");
      const returnOrigin = params.get("origin");

      function fail(text) {
        const el = document.getElementById("message");
        el.textContent = text;
        el.className = "error";
      }

      function onApiLoad() {
        gapi.load("picker", createPicker);
      }

      function createPicker() {
        if (
          !token ||
          !returnOrigin ||
          !returnOrigin.startsWith("chrome-extension://")
        ) {
          fail(
            "Missing auth context — open this page from the extension’s Options.",
          );
          return;
        }
        const view = new google.picker.DocsView(
          google.picker.ViewId.SPREADSHEETS,
        ).setIncludeFolders(true);
        const picker = new google.picker.PickerBuilder()
          .setOAuthToken(token)
          .setDeveloperKey(API_KEY)
          .setAppId(APP_ID)
          .addView(view)
          .setTitle("Select a spreadsheet for history sync")
          .setCallback(onPicked)
          .build();
        picker.setVisible(true);
        document.getElementById("message").textContent =
          "Pick the spreadsheet to sync history into.";
      }

      function onPicked(data) {
        if (data.action === google.picker.Action.PICKED) {
          const doc = data.docs[0];
          if (window.opener) {
            window.opener.postMessage(
              { type: "sheet-picked", id: doc.id, name: doc.name },
              returnOrigin,
            );
          }
          window.close();
        } else if (data.action === google.picker.Action.CANCEL) {
          window.close();
        }
      }
    </script>
    <script
      src="https://apis.google.com/js/api.js"
      onload="onApiLoad()"
    ></script>
  </body>
</html>
