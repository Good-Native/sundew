<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 12px;
        font-size: 13px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      button {
        width: 100%;
        padding: 8px;
        font-size: 13px;
        margin-top: 8px;
        cursor: pointer;
      }
      #lastResult {
        margin-top: 8px;
        white-space: pre-line;
      }
      #lastResult.ok {
        color: #1a7f37;
      }
      #lastResult.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <h1>Sundew</h1>
    <div id="destination">Not configured</div>
    <div id="lastResult"></div>
    <button id="syncNowButton">Sync now</button>
    <button id="optionsButton">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
