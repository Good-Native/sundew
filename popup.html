<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sundew.css" />
    <style>
      body {
        width: 280px;
        padding: 16px;
      }
      .brand {
        margin-bottom: 12px;
      }
      .brand img {
        height: 28px;
      }
      #destination {
        margin-bottom: 4px;
      }
      #lastResult {
        white-space: pre-line;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/wordmark.svg" alt="sundew" />
    </div>
    <div id="destination" class="hint">Not configured</div>
    <div id="lastResult"></div>
    <button id="syncNowButton" class="primary">Sync now</button>
    <button id="optionsButton">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
