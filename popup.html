<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="sundew.css" />
    <style>
      body {
        width: 280px;
        padding: 16px;
        background: var(--amber);
      }
      .brand {
        margin-bottom: 12px;
      }
      .brand img {
        height: 28px;
      }
      button {
        background: var(--white);
      }
      button:hover {
        background: rgba(255, 255, 255, 0.7);
      }
      button.primary {
        background: var(--red);
      }
      button.primary:hover {
        background: #7d0920;
      }
      #destination {
        margin-bottom: 8px;
      }
      .sheet-button {
        display: block;
        margin-top: 4px;
        background: var(--white);
        border: 1px solid var(--red-faint);
        border-radius: 100px;
        padding: 7px 16px;
        text-align: center;
        font-weight: 500;
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sheet-button:hover {
        background: rgba(255, 255, 255, 0.7);
        text-decoration: none;
      }
      #lastResult {
        white-space: pre-line;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/wordmark-on-amber.svg" alt="sundew" />
    </div>
    <div id="destination" class="hint">Not configured</div>
    <div id="lastResult"></div>
    <button id="syncNowButton" class="primary">Sync now</button>
    <button id="optionsButton">Settings</button>
    <script src="popup.js"></script>
  </body>
</html>
