<!doctype html>
<html>
  <head>

    <link rel="stylesheet" href="sundew.css" />
    <style>
      body {
        width: 280px;
        padding: 16px;
      }
      h1 {
        font-size: 14px;
        font-weight: 500;
        margin: 0;
      }
      .brand {
        margin-bottom: 12px;
      }
      #destination {
        margin-bottom: 4px;
      }
      #lastResult {

        margin-bottom: 12px;
      }
      button {

        margin-top: 8px;
      }

    <div class="brand">
      <img src="icons/icon.svg" alt="" />
      <h1>sundew</h1>
    </div>

    <div id="lastResult"></div>
    <button id="syncNowButton" class="primary">Sync now</button>
    <button id="optionsButton">Settings</button>
    <script src="popup.js"></script>
